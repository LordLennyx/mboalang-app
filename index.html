  <style>
    html, body { margin: 0; height: 100%; background: #146B3A; }
    /* Écran de chargement : retiré au premier écran de l'application. */
    #mboa-splash {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #146B3A;
      color: #fff; font: 800 22px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .35s ease;
    }
    #mboa-splash.gone { opacity: 0; pointer-events: none; }
    #mboa-splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    #mboa-splash .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); overflow: hidden; }
    #mboa-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #F2B33D;
      animation: mboa-load 1.1s ease-in-out infinite;
    }
    @keyframes mboa-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #mboa-splash .bar::after { animation: none; width: 100%; } }

    /* Application installée sur ordinateur (Chrome, Edge) : l'application vit
       dans #mboa-app, sous la barre de titre que MboaLang dessine elle-même
       quand la fenêtre masque celle du système (Window Controls Overlay). */
    html.mboa-embedded #mboa-app { position: fixed; left: 0; right: 0; bottom: 0; top: 0; }
    #mboa-titlebar { display: none; }
    @media (display-mode: window-controls-overlay) {
      html.mboa-embedded #mboa-app { top: env(titlebar-area-height, 33px); }
      #mboa-titlebar {
        display: flex; align-items: center; gap: 8px; position: fixed; z-index: 5;
        left: env(titlebar-area-x, 0px); top: env(titlebar-area-y, 0px);
        width: env(titlebar-area-width, 100%); height: env(titlebar-area-height, 33px);
        padding: 0 12px; box-sizing: border-box; color: #fff; user-select: none;
        font: 700 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-app-region: drag; app-region: drag;
      }
      #mboa-titlebar img { width: 18px; height: 18px; border-radius: 5px; }
      #mboa-titlebar span { opacity: .78; font-weight: 500; }
    }
  </style>
</head>
<body>
  <div id="mboa-splash" role="status" aria-label="MboaLang">
    <img src="icons/Icon-192.png" alt="">
    <div>MboaLang</div>
    <div class="bar"></div>
  </div>
  <div id="mboa-titlebar" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">MboaLang
  </div>
  <div id="mboa-app"></div>
  <!-- defer : l’écran de chargement s’affiche sans attendre ce script (2G). -->
  <script src="mboa_web.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
